# Builds the Windows installer on GitHub's servers (free for public repositories).
# Usage: push a tag like v1.0.0  (or run it manually from the Actions tab).
name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Build app folder
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name PortfolioManager
          --exclude-module tkinter --exclude-module numpy --exclude-module pandas
          --exclude-module plotly --exclude-module matplotlib --exclude-module lxml
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtMultimedia
          stock_app.py

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PortfolioManager_setup.iss

      - name: Make portable zip
        run: Compress-Archive -Path dist\PortfolioManager\* -DestinationPath Output\PortfolioManager_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioManager
          path: |
            Output/PortfolioManager_Setup.exe
            Output/PortfolioManager_portable.zip

      - name: Publish release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/PortfolioManager_Setup.exe
            Output/PortfolioManager_portable.zip
